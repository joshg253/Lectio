  <div id="folder-properties-modal" class="action-modal" hidden>
    <div class="action-modal-panel feed-properties-panel" role="dialog" aria-modal="true" aria-labelledby="folder-properties-title">
      <div class="feed-properties-header-row">
        <h3 id="folder-properties-title" class="action-modal-title">Folder Properties</h3>
        <button type="button" id="folder-properties-close" class="feed-properties-close" aria-label="Close"><span class="material-symbols-rounded" aria-hidden="true">close</span></button>
      </div>
      <dl class="feed-properties-grid">
        <dt>Folder</dt><dd id="folder-prop-path">-</dd>
        <dt>Feeds</dt><dd id="folder-prop-feed-count">-</dd>
        <dt>Articles</dt><dd id="folder-prop-total">-</dd>
        <dt>Refresh cadence</dt>
        <dd>
          <select id="folder-prop-cadence" class="feed-prop-strategy-select" style="width:auto">
            <option value="0">Use global setting</option>
            <option value="1">Every 1 min</option>
            <option value="2">Every 2 min</option>
            <option value="5">Every 5 min</option>
            <option value="10">Every 10 min</option>
            <option value="15">Every 15 min</option>
            <option value="30">Every 30 min</option>
            <option value="60">Every hour</option>
            <option value="120">Every 2 hours</option>
            <option value="360">Every 6 hours</option>
            <option value="720">Every 12 hours</option>
            <option value="1440">Once a day</option>
          </select>
          <span id="folder-prop-cadence-status" class="feed-prop-inline-status"></span>
        </dd>
        <dt>Delete after read</dt>
        <dd>
          <select id="folder-prop-retention" class="feed-prop-strategy-select" style="width:auto" title="Nightly maintenance deletes read posts this long after you read them. Starred and tagged posts are never deleted.">
            <option value="0">Keep forever</option>
            <option value="1">1 day after read</option>
            <option value="3">3 days after read</option>
            <option value="7">1 week after read</option>
            <option value="14">2 weeks after read</option>
            <option value="30">30 days after read</option>
            <option value="90">90 days after read</option>
          </select>
          <span id="folder-prop-retention-status" class="feed-prop-inline-status"></span>
        </dd>
      </dl>
      <div id="folder-prop-top-feeds-wrap" hidden>
        <h4 class="folder-prop-section-title">Most active feeds</h4>
        <table class="folder-prop-top-feeds">
          <thead><tr><th>Feed</th><th>Avg/week</th><th>Total</th></tr></thead>
          <tbody id="folder-prop-top-feeds-body"></tbody>
        </table>
      </div>
    </div>
  </div>
