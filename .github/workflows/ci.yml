name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the previous in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        # setup-uv publishes no moving major tag; pin the exact release by SHA.
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          # Reuse the cache only when the lockfile is unchanged.
          cache-dependency-glob: uv.lock

      # Installs the interpreter pinned by .python-version / requires-python.
      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Run test suite
        # -W error::DeprecationWarning fails the build on any deprecation so they
        # surface immediately instead of accumulating silently.
        run: uv run --frozen pytest -q -W error::DeprecationWarning

      - name: Audit dependencies
        # `uv audit` (OSV-backed) is still a preview feature, so keep it
        # informational — don't gate merges on it until it stabilizes.
        continue-on-error: true
        run: uv audit --preview-features audit --frozen

  lint:
    name: Ruff (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need history back to the base commit to diff against it.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      # The same script .githooks/pre-commit runs, so a commit that passed
      # locally cannot fail here. It gates the *lines* this PR touches rather
      # than whole files: main.py alone carries ~120 existing findings and is
      # touched by nearly every change, so a file-level gate would be red
      # forever and get ignored — which is how a duplicate method definition
      # sat in services/lead_images.py unnoticed.
      - name: Lint the lines this PR touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)}"
          uv run --frozen python scripts/lint_changed.py --base "$base"

      # The whole-repo view, informational: shows the backlog shrinking without
      # blocking a merge on work this PR did not touch.
      - name: Whole-repo lint (informational)
        continue-on-error: true
        run: uv run --frozen ruff check . --statistics
